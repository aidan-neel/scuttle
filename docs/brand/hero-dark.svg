<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" fill="none" role="img" aria-label="Scuttle">
  <style>
    .mark{animation:dash .95s cubic-bezier(.16,.84,.24,1) both}
    .trail{animation:trail 1.1s ease-out both}
    .l{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
    .bar{transform-box:fill-box;transform-origin:left center;animation:bar .5s .95s cubic-bezier(.2,.8,.2,1) both}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s 1.6s infinite}
    @keyframes dash{from{transform:translateX(-150px);opacity:0}40%{opacity:1}}
    @keyframes trail{from{opacity:0;transform:translateX(-150px)}35%{opacity:.55}to{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}}
    @keyframes bar{from{transform:scaleX(0)}}
    .glint{animation:glint 5.5s 1.6s infinite}
    @keyframes glint{0%,93%,100%{opacity:1}96%,98%{opacity:0}}
    @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.trail{opacity:0}}
  </style>
  <g class="trail" stroke="#2f6bf0" stroke-width="10" stroke-linecap="round">
    <path d="M52.0 102H102.0"/><path d="M70.0 138H104.0"/>
  </g>
  <g transform="translate(93.22 13.60) scale(1.6)"><g class="mark">
  <defs>
    <mask id="mm"><rect x="-20" y="-20" width="168" height="168" fill="#fff"/>
      <g stroke="#000" stroke-width="9" stroke-linecap="round"><path d="M-10 56H44"/><path d="M-10 76H34"/></g>
    </mask>
    <mask id="ms"><circle cx="62" cy="64" r="44" fill="#fff"/><circle cx="57" cy="56" r="44" fill="#000"/></mask>
    <linearGradient id="mg" x1="0" y1="20" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3570f1"/><stop offset="1" stop-color="#2f6bf0"/>
    </linearGradient>
  </defs>
  <g mask="url(#mm)">
    <circle cx="62" cy="64" r="44" fill="url(#mg)"/>
    <rect x="0" y="0" width="128" height="128" fill="#1f4fcf" opacity="0.45" mask="url(#ms)"/>
    <path d="M32.56 47A34 34 0 0 1 46.04 33.98" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.4"/>
    <circle cx="54.93" cy="30.74" r="3.3" fill="#ffffff" opacity="0.4"/>
  </g>
  <ellipse class="eye" cx="79" cy="58" rx="6.5" ry="7.8" fill="#09090a"/><ellipse class="eye" cx="95" cy="58" rx="6.5" ry="7.8" fill="#09090a"/>
  <circle class="glint" cx="81" cy="54.8" r="2.4" fill="#ffffff"/><circle class="glint" cx="97" cy="54.8" r="2.4" fill="#ffffff"/></g></g>
  <g transform="translate(292.82 37.75) scale(1.75)">
    <g stroke="#f0f6fc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="l" style="animation-delay:0.42s" d="M26.06 40.11A11.5 8.6 0 1 0 17 54A12.5 8.6 0 1 1 7.15 67.89"/><path class="l" style="animation-delay:0.48s" d="M75.48 42.49A17.2 17.2 0 1 0 75.48 65.51"/><path class="l" style="animation-delay:0.54s" d="M93.4 38V56A14 14 0 0 0 121.4 56V38M121.4 56V70"/><path class="l" style="animation-delay:0.60s" d="M147.9 24V62A8 8 0 0 0 155.9 70"/><path class="l" style="animation-delay:0.66s" d="M177.9 24V62A8 8 0 0 0 185.9 70"/><path class="l" style="animation-delay:0.72s" d="M205.4 16V70"/><path class="l" style="animation-delay:0.78s" d="M226.9 52.5H261.3A17.2 17.2 0 1 0 257.28 65.06"/></g>
    <path class="bar" d="M139.9 38H185.9" stroke="#2f6bf0" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
