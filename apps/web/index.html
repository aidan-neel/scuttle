<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scuttle</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090a" />
    <style>
      .scuttle-boot {
        display: grid;
        place-items: center;
        height: 100dvh;
        background: #09090a;
      }
      .scuttle-boot svg {
        width: 44px;
        height: 44px;
        animation: scuttle-boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes scuttle-boot-pulse {
        0%,
        100% {
          opacity: 0.72;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .scuttle-boot svg {
          animation: none;
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body class="bg-chrome text-fg antialiased">
    <div id="root">
      <div class="scuttle-boot" role="status" aria-label="Loading Scuttle">
        <svg viewBox="18 20 88 88" fill="none" aria-hidden="true">
          <defs>
            <mask id="boot-cut" maskUnits="userSpaceOnUse" x="18" y="20" width="88" height="88">
              <rect x="18" y="20" width="88" height="88" fill="#fff" />
              <path
                d="M-10 56H44M-10 76H34"
                stroke="#000"
                stroke-width="9"
                stroke-linecap="round"
              />
            </mask>
            <mask id="boot-sh" maskUnits="userSpaceOnUse" x="18" y="20" width="88" height="88">
              <circle cx="62" cy="64" r="44" fill="#fff" />
              <circle cx="57" cy="56" r="44" fill="#000" />
            </mask>
            <linearGradient
              id="boot-fill"
              x1="0"
              y1="20"
              x2="0"
              y2="108"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#3570f1" />
              <stop offset="1" stop-color="#2f6bf0" />
            </linearGradient>
          </defs>
          <g mask="url(#boot-cut)">
            <circle cx="62" cy="64" r="44" fill="url(#boot-fill)" />
            <rect
              x="18"
              y="20"
              width="88"
              height="88"
              fill="#1f4fcf"
              opacity="0.45"
              mask="url(#boot-sh)"
            />
            <path
              d="M32.56 47A34 34 0 0 1 46.04 33.98"
              stroke="#ffffff"
              stroke-width="6.5"
              stroke-linecap="round"
              opacity="0.4"
            />
            <circle cx="54.93" cy="30.74" r="3.3" fill="#ffffff" opacity="0.4" />
          </g>
          <ellipse cx="79" cy="58" rx="6.5" ry="7.8" fill="#09090a" />
          <ellipse cx="95" cy="58" rx="6.5" ry="7.8" fill="#09090a" />
          <circle cx="81" cy="54.8" r="2.4" fill="#ffffff" />
          <circle cx="97" cy="54.8" r="2.4" fill="#ffffff" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
